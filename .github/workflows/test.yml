name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...

  install-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o tomo ./cmd/tomo
      - run: ./tomo install
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "install left the tree dirty — a harness install target is not gitignored:"
            git status --porcelain
            exit 1
          fi
